<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fe0175" />

    <!--
      Meta tags base / fallback.
      react-helmet-async (ver src/components/Seo.tsx) los SOBRESCRIBE en runtime
      según la página. Estos quedan como respaldo para crawlers que no ejecutan
      JavaScript (algunos bots viejos, o el primer paint antes de hidratar).
    -->
    <title>Toque De Amor — Somos La Excusa Perfecta Para Sorprender</title>
    <meta
      name="description"
      content="Somos la excusa perfecta para sorprender. Diseñamos piezas únicas para cada historia — anchetas, tarjetas y kits hechos a mano."
    />
    <link rel="canonical" href="https://toquedeamor.store" />

    <!-- Open Graph (ver explicación completa en src/components/Seo.tsx) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Toque De Amor" />
    <meta property="og:title" content="Toque De Amor — Regalos personalizados" />
    <meta
      property="og:description"
      content="Somos La Excusa Perfecta Para Sorprender. Diseñamos piezas únicas para cada historia."
    />
    <meta property="og:image" content="https://toquedeamor.store/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://toquedeamor.store" />
    <meta property="og:locale" content="es_ES" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Toque De Amor — Somos La Excusa Perfecta Para Sorprender" />
    <meta
      name="twitter:description"
      content="Somos La Excusa Perfecta Para Sorprender. Toque De Amor diseña piezas únicas para cada historia."
    />
    <meta name="twitter:image" content="https://toquedeamor.store/og-cover.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!--
      JSON-LD (schema.org) — datos estructurados que Google usa para "rich
      results": puede mostrar tu horario, teléfono y ubicación directo en la
      búsqueda, sin que la persona entre al sitio. No se ve en pantalla, es
      solo para motores de búsqueda.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Toque De Amor",
        "description": "Somos La Excusa Perfecta Para Sorprender — anchetas, tarjetas y kits hechos a mano.",
        "url": "https://www.toquedeamor.store",
        "telephone": "+34-634-13-06-42",
        "priceRange": "€€",
        "image": "https://www.toquedeamor.store/og-cover.png",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Tenerife, España",
          "addressCountry": "ES"
        },
        "sameAs": ["https://www.instagram.com/toquedeamor.es"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
